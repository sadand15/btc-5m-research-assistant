name: M10.2 Offline Reproduction
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  reproduce:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Reproduce from clean checkout before installing dependencies
        run: python scripts/verify_m102_reproduction.py
      - name: Install test runner
        run: python -m pip install "pytest>=8,<10"
      - name: Integration and synthetic semantics tests
        run: python -m pytest -q tests/test_m102_offline_integration.py tests/test_target_semantics_lab.py tests/test_m102_reproduction.py
      - name: Staged tree credential scan
        run: python scripts/security_scan.py index
      - name: Reachable history credential scan
        run: python scripts/security_scan.py history
      - name: Publish verified synthetic reports
        uses: actions/upload-artifact@v4
        with:
          name: m102-research-report-${{ runner.os }}
          path: runtime/m102-offline-integration/**
          if-no-files-found: error
          retention-days: 14
