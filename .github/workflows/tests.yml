name: Tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  tests:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -m pip install -e . --no-deps
      - run: python -m pytest -q
      - run: python -m btc5_v3.demo --project-root .
      - run: python -m btc5_v3.edge.demo --project-root .
      - run: python -m btc5_v3.decision.demo --project-root .
      - run: python -m btc5_v3.analytics.demo --project-root .
      - run: python -m btc5_v3.path.demo --project-root .
      - run: python -m btc5_v3.execution.demo --project-root .
      - run: python -m btc5_v3.risk.demo --project-root .
      - run: python -m btc5_v3.monitoring.demo --project-root .
      - run: python -m btc5_v3.data_quality.demo --project-root .
      - run: python -m btc5_v3.validation.demo --project-root .
      - run: python -m btc5_v3.robustness.demo --project-root .
      - run: python -m btc5_v3.m8.demo --project-root .
      - run: python -m btc5_v3.prospective.demo --project-root .
      - name: Prospective image build and offline smoke
        if: runner.os == 'Linux'
        run: |
          docker build --build-arg COLLECTOR_SHA=${{ github.sha }} -f deployment/prospective/Dockerfile -t btc5-prospective-ci .
          docker run --rm --network none btc5-prospective-ci python -m btc5_v3.prospective.demo --project-root /app
      - run: python scripts/security_scan.py index
      - run: python scripts/security_scan.py history
