name: Realtime Dashboard
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  dashboard:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pytest==9.1.1 playwright==1.63.0
      - run: python -m playwright install --with-deps chromium
      - run: python -m pytest -q tests/test_realtime_dashboard.py
      - run: python scripts/verify_realtime_dashboard_ui.py
      - run: python scripts/verify_m102_reproduction.py
      - run: python scripts/security_scan.py index
      - run: python scripts/security_scan.py history
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dashboard-ui-${{ runner.os }}
          path: runtime/dashboard-ui-tests/
          if-no-files-found: warn
          retention-days: 14
